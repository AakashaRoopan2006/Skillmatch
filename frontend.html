.logout-button {

.logout-button:hover {

/* MAIN AREA */

.dashboard-main {

.dashboard-topbar {

    linear-gradient(135deg, #20264b, #30315c);
  color: white;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 50px rgba(32, 38, 75, 0.18);
}

.welcome-card::after {
  content: "";
  width: 220px;
  height: 220px;
  border: 35px solid rgba(255, 255, 255, 0.05);
  border-radius: 50%;
  position: absolute;
  right: -75px;
  bottom: -100px;
}

.welcome-card h1 {
  margin: 10px 0;
  font-family: "Space Grotesk", sans-serif;
  font-size: clamp(30px, 4vw, 48px);
  letter-spacing: -2px;
}

.welcome-card p:not(.small-label) {
  max-width: 550px;

  line-height: 1.7;
}

.welcome-card .small-label {

}

.welcome-illustration {
  width: 120px;
  height: 120px;
  display: grid;
  place-items: center;
  border-radius: 35px;
  background: rgba(255, 255, 255, 0.1);
  font-size: 65px;
  transform: rotate(5deg);
}

/* STAT CARDS */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin: 25px 0 45px;
}

.stat-card {
  display: flex;
  align-items: center;
  gap: 17px;
  padding: 24px;
  background: white;
  border: 1px solid rgba(27, 29, 53, 0.06);
  border-radius: 23px;
  box-shadow: var(--shadow);
}

.stat-icon {
  width: 55px;
  height: 55px;
  display: grid;
  place-items: center;
  border-radius: 18px;
  background: #efedff;
  font-size: 25px;

.stat-card h3 {

  font-family: "Space Grotesk", sans-serif;
  font-size: 29px;

.stat-card p {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 13px;
}

.section-heading,
.page-heading {
  margin-bottom: 23px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.section-heading h2,
.page-heading h1 {
  margin: 8px 0 0;
  font-family: "Space Grotesk", sans-serif;
  letter-spacing: -1px;
}

.section-heading h2 {
  font-size: 27px;
}

.page-heading h1 {
  font-size: 39px;
}

.page-heading p:not(.small-label) {
  color: var(--text-muted);
  line-height: 1.6;
}

.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 45px;
}

.action-card {
  padding: 27px;
  text-align: left;
  border: 1px solid rgba(27, 29, 53, 0.07);
  border-radius: 25px;
  background: white;
  box-shadow: var(--shadow);
  transition: 0.3s ease;

.action-card:hover {
  transform: translateY(-7px);
  border-color: var(--purple-light);
  box-shadow: 0 25px 50px rgba(139, 124, 255, 0.17);

.action-card > span {

  margin: 18px 0 8px;
  font-family: "Space Grotesk", sans-serif;
  font-size: 20px;
}

.action-card p {
  min-height: 48px;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.6;
}

.action-card strong {
  display: inline-block;
  margin-top: 12px;
  color: #7164df;
  font-size: 13px;
}

/* PROFILE SUMMARY */

.profile-summary {
  padding: 30px;
  background: white;
  border-radius: 26px;
  box-shadow: var(--shadow);
}

.text-button {
  border: 0;
  background: #efedff;
  color: #7164df;
  padding: 11px 15px;
  border-radius: 12px;
  font-weight: 700;
}

.profile-details-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.profile-details-grid div,
.profile-info-list div {
  padding: 18px;
  background: #f7f6ff;
  border-radius: 16px;
}

.profile-details-grid span,
.profile-info-list span {
  display: block;
  margin-bottom: 8px;
  color: var(--text-muted);
  font-size: 12px;
}

.profile-details-grid strong,
.profile-info-list strong {
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.career-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.career-card {
  position: relative;
  padding: 27px;
  min-height: 280px;
  border: 1px solid rgba(27, 29, 53, 0.07);

  background: white;
  text-align: left;
  box-shadow: var(--shadow);
  transition: 0.3s ease;
}

.career-card:hover,
.career-card.selected {
  transform: translateY(-6px);

}

.career-icon {
  display: inline-grid;
  place-items: center;
  width: 57px;
  height: 57px;
  border-radius: 19px;
  background: linear-gradient(135deg, #efedff, #e1fff4);
  font-size: 28px;
}

.career-category {
  display: block;
  margin-top: 18px;
  color: #8b7cff;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.career-card h3 {
  margin: 9px 0;
  font-family: "Space Grotesk", sans-serif;
  font-size: 21px;
  letter-spacing: -0.5px;
}

.career-card p {
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.65;
}

.career-card strong {
  display: inline-block;
  margin-top: 10px;
  color: #7164df;
  font-size: 13px;
}

/* CAREER DETAILS */

.career-details-card {
  position: relative;
  margin-top: 30px;
  padding: 35px;
  border-radius: 28px;
  background: linear-gradient(135deg, #20264b, #30315c);
  color: white;
  box-shadow: 0 25px 60px rgba(32, 38, 75, 0.2);
}

.close-details {
  position: absolute;
  top: 22px;
  right: 22px;
  width: 35px;
  height: 35px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  color: white;
}

.career-details-card h2 {
  margin: 15px 0 10px;
  font-family: "Space Grotesk", sans-serif;
  font-size: 32px;
}

.career-details-card > p:not(.small-label) {
  max-width: 750px;
  color: #c8cbe0;
  line-height: 1.7;
}

.career-details-card .small-label {
  margin-top: 20px;
  color: var(--mint);
}

.details-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  margin: 30px 0;
}

.details-columns h3,
.career-details-card > h3 {
  color: var(--mint);
  font-size: 17px;
}

.details-columns ul {
  padding-left: 20px;
  color: #d9dced;
  line-height: 2;
}

.roadmap-list {
  display: grid;
  gap: 12px;
  padding: 0;
  list-style: none;
}

.roadmap-list li {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  color: #e0e2f0;
}

.roadmap-list span {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--purple);
  color: white;
  font-weight: 800;
}

/* PROFILE PAGE */

.profile-card-large {
  max-width: 650px;
  padding: 40px;
  text-align: center;
  background: white;
  border-radius: 30px;
  box-shadow: var(--shadow);
}

.profile-avatar {

  height: 90px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--purple), var(--mint));
  color: var(--navy);
  font-family: "Space Grotesk", sans-serif;
  font-size: 43px;
  font-weight: 700;
}

.profile-card-large h2 {
  margin: 0;
  font-family: "Space Grotesk", sans-serif;
  font-size: 29px;
}

.profile-card-large > p {
  color: var(--text-muted);
}

.profile-info-list {
  display: grid;
  gap: 12px;
  margin-top: 30px;
  text-align: left;
}

/* JOBS */

.job-list {
  display: grid;
  gap: 16px;
}

.job-card {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 23px;
  background: white;
  border: 1px solid rgba(27, 29, 53, 0.07);
  border-radius: 22px;
  box-shadow: var(--shadow);

.job-icon {
  width: 62px;
  height: 62px;

  place-items: center;
  border-radius: 20px;

}

.job-information {
  flex: 1;
  min-width: 0;
}

.job-information h3 {
  margin: 0 0 5px;
  font-family: "Space Grotesk", sans-serif;
  font-size: 19px;
}

.job-information p {
  margin: 0 0 7px;
  color: #8b7cff;
  font-size: 13px;
  font-weight: 700;
}

.job-information span {
  color: var(--text-muted);
  font-size: 12px;
}

.small-button {
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  background: var(--navy);
  color: white;
  font-weight: 700;
  transition: 0.25s ease;
}

.small-button:hover {
  background: var(--purple);
}

/* LEARNING */

.learning-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.learning-card {
  padding: 27px;
  border-radius: 25px;
  background: white;
  box-shadow: var(--shadow);
}

.learning-card h3 {
  margin: 17px 0;
  font-family: "Space Grotesk", sans-serif;
}

.learning-card ol {
  padding-left: 22px;
  color: var(--text-muted);
  line-height: 2;
  font-size: 13px;
}

.learning-card .small-button {
  margin-top: 15px;
}

@media (max-width: 1100px) {

    width: 225px;

    display: grid;

    margin-top: 18px;

    padding: 23px;

  .dashboard-content {

    padding: 28px;
  }

  .welcome-illustration {
    display: none;
  }

  .stats-grid,
  .profile-details-grid {
    grid-template-columns: 1fr;
  }

  .career-grid,
  .learning-grid {
    grid-template-columns: 1fr;
  }

  .details-columns {
    grid-template-columns: 1fr;
  }

    align-items: flex-start;

  .topbar-user {
    align-self: flex-end;

  .small-button {
    width: 100%;
  }

.job-skills {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 13px;
}

.skill-tag {
  padding: 6px 10px;
  border-radius: 9px;
  background: #efedff;
  color: #7164df;
  font-size: 11px;
  font-weight: 700;
}  

.match-percentage {
  margin-top: 14px;
  width: 100%;
}

.match-percentage strong {
  color: #56745c;
  font-size: 14px;
}

.match-bar {
  width: 100%;

.match-fill {

.match-percentage small {

.job-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 120px;
}

.save-button {
  border: 1px solid #789b7d;
  background: transparent;
  color: #456b50;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
}

.save-button:hover {
  background: #edf3ea;
}

.empty-state {
  background: #ffffff;
  border-radius: 18px;
  padding: 35px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(70, 80, 60, 0.08);
}

.empty-state h3 {
  margin-bottom: 10px;
}

.empty-state p {
  color: #777;
  margin-bottom: 20px;
}

@media (max-width: 700px) {
  .job-card {
    flex-direction: column;
    align-items: stretch;
  }

  .job-actions {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .job-actions button {
    flex: 1;
  }
